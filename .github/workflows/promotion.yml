name: promotion
# The gate `main` has and `release` does not. Every wall runs on both targets
# under ci.yml; this is the thing that only a promotion is asked. It refuses a
# task whose verdict is `regressed`, `nothing ran` or `not delivered`, a head
# that is not `release`, and any red wall, and it names every one of them
# before it exits.
#
# Its own workflow rather than a job with a condition: a job skipped by a
# condition reports as a check that passed, and a gate that reports success
# where it did not run is the vacuous pass this league has a wall about.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  KAAL_BRANCH: ${{ github.head_ref || github.ref_name }}
  KAAL_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      # The half the engine cannot hold. `kaal` reads a tree and a branch and
      # cannot know who opened a pull request without being told by a
      # provider, so the paths are its evidence and the author is this
      # workflow's. `main` takes one lane beside the promotion; a head
      # claiming that lane and opened by anybody but the bot is refused here
      # and nowhere else, because a tree checked out anywhere else admits a
      # branch by name.
      #
      # Both values reach the shell as environment variables and never as
      # interpolation inside the script: a branch name is attacker chosen and
      # a workflow that pastes one into a command has handed it the runner.
      - name: only the bot rides the bot's lane
        if: startsWith(github.head_ref, 'dependabot/') && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          HEAD: ${{ github.head_ref }}
          WHO: ${{ github.event.pull_request.user.login }}
        run: |
          echo "$HEAD: head: a dependency update lane, opened by $WHO and not dependabot[bot]" >&2
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the targets, for the walls that read a base
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node bin/kaal.mjs promote
