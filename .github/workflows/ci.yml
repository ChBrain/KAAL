name: ci
# Every wall the league has, on every pull request and every push to main,
# under the one command the hook runs locally. Local green and CI green are
# the same command by construction. Two platforms and two
# runtimes: `walls` is the required check and keeps its name;
# `walls-windows` is the proof gates-v2 lacked; `walls-node-24` is the proof
# a-wall-reads-one-format lacked. Each is a job of its own rather than a
# matrix on `walls`, because a matrix renames the check to `walls (22)` and
# the required check is named `walls`.
# The standard job runs the Agent Skills reference validator over every skill
# and compares the pinned specification with the live text, on every pull
# request, every push to main and once a week, so divergence in either
# direction is red here without anyone remembering to look.
# Every checkout fetches the whole history. The class wall reads a diff
# against origin/main, and a checkout at depth one fetches a pull
# request's merge commit and nothing else, so that ref is absent; a wall
# that cannot run is a failure and never a skip (gates-v1), so the base
# has to be present rather than the wall forgiving.
# not run: the model evals under evals/; those come from a person's runtime and from evals.yml on an /eval comment.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
permissions:
  contents: read
# The lane the seats wall reads. A checkout on a pull request leaves HEAD
# detached at the merge ref, so git names no branch and the wall would answer
# that the question is not this tree's on every pull request. The name the
# league owns is read here and the provider's is read only here, so the engine
# stays vendor agnostic and any runner can set the same one.
env:
  KAAL_BRANCH: ${{ github.head_ref || github.ref_name }}
jobs:
  walls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # origin/main, for the class wall
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
  # The runtime the league does not pin. Node prints TAP when its test output
  # is piped on 22 and spec on 24, and both are correct; a wall that read one
  # shape reported every closed task as zero passing and called itself green.
  # That defect reached main because CI ran one runtime and a contributor
  # tripped over it on their own machine instead. Four retros asked for this
  # job before it existed.
  walls-node-24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # origin/main, for the class wall
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
  walls-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # origin/main, for the class wall
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
  standard:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # origin/main, for the class wall
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - run: for d in skills/*/; do skills-ref validate "$d"; done
        shell: bash
      - run: node bin/kaal.mjs standard
